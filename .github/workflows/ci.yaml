name: Library Management CI

on:
    push: 
        branches: [ main ]
    pull_request: 

jobs:
    run-tests:
        strategy: 
            fail-fast: false
            matrix: 
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version:
                    - "3.8"
                    - "3.9"
                    - "3.10"
                    - "3.11"
                    - "3.12-dev"

        name: Test
        runs-on: ${{ matrix.os }}

        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Set up Python
            uses: actions/setup-python@v5
            with: 
                python-version: ${{ matrix.python-version }}

          - name: Install dependencies
            shell: bash
            run: |
                python -m pip install --upgrade pip
                python -m pip install pytest 
                pip install -r requirements.txt pytest-mock
                pip install --force-reinstall pytest pytest-mock

          - name: Verify pytest-mock installation
            shell: bash
            run: |
              python -m pip list
              echo "---- pytest-mock package info ----"
              python -m pip show pytest-mock || echo "pytest-mock not installed!"
              echo "---- pytest version ----"
              python -m pytest --version
            
          - name: Run tests
            shell: bash
            run: python -m pytest -v


            